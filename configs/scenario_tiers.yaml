# H0 v2 수요 시나리오 티어 정의 (etc/plan_h0_revision.md §1.4).
# 사용자 확정 2026-08-03/04. 값을 바꾸려면 plan_h0_revision.md도 함께
# 갱신할 것 (analysis/scenario_tiers.py가 이 파일을 유일한 정본으로 읽는다).
#
# ── 모델링 코퍼스 (28개) ────────────────────────────────────────────────
# primary(1차)  = K50, K100, K200  -> 20개. 기본 결과 분석·본문 보고에 사용.
# extreme(극단) = K300             ->  8개. 1차 분석 완료 후 극단 케이스 분석.
#
# ── 보류 (11개) ─────────────────────────────────────────────────────────
# excluded      = K500, K750, K1000 -> 11개.
#   **사용자 확정 2026-08-04: 본 실험에서 우선 보류.**
#   분석뿐 아니라 **검증 배터리에서도 사용하지 않는다** — 즉 코드 동작상으로는
#   완전 배제와 같다. 다만 지위는 "영구 제외"가 아니라 "이번 실험 범위 밖"이며,
#   향후 부록 스트레스 트랙 등으로 재개할 여지를 남긴다(재개하려면 이 파일의
#   excluded 블록을 티어로 승격하고 배터리 기대 개수를 함께 고쳐야 한다).
#   키 이름 `excluded`는 코드 API(`is_excluded`/`excluded_paths`)와 맞물려 있어
#   그대로 두었다 — 이름은 '제외', 지위는 '보류'다.
#
# 합계 20 + 8 = 28 = 모델링 대상 전수. 제외 11개를 더하면 data/data1의 K*.json
# 39개 (STAGE3_*.json 등은 이 티어 체계 밖의 별도 트랙이라 어느 쪽도 아니다).
#
# 중요 — 구 규약에서 바뀐 점: 종전에는 "검증 배터리는 39개 전수를 쓰고 이 파일을
# 참조하지 않는다"였으나, **배터리도 28개 코퍼스를 쓴다.** 근거는 "제외가
# 영구적이라서"가 아니라 **"본 실험이 돌리지 않는 수요를 회귀 감시할 이유가
# 없어서"** 다 — 보류가 풀리면 이 규약도 함께 되돌린다.
# 즉 배터리는 이제 이 파일을 정본으로 참조해야 하며, `data/data1`를 직접
# glob 해 39개를 세는 코드는 전부 오류다 (plan §1.4, plan_h0v2_verification.md §1).
tiers:
  primary:
    k_levels: [50, 100, 200]
  extreme:
    k_levels: [300]

# 보류 — 티어가 아니라 코퍼스 밖. `all`에도 포함되지 않는다. (키 이름은 코드 API와
# 맞물려 `excluded` 그대로.)
excluded:
  k_levels: [500, 750, 1000]
  reason: >-
    사용자 확정 2026-08-04: 본 실험에서 우선 보류. 모델링 수요 범위는
    K50~K300 (주문률 5.6~33.3%/h — 사무 상주 900명 기준. 2026-08-04 정정:
    구 표기 "약 6~38%/h"는 v1 빌딩의 상주 800명으로 계산된 값이었다)으로
    한정한다. 영구 폐기가 아니라 범위 밖
    처리이며, 재개 시에는 배터리 기대 개수(28)와 인용 모집단을 함께 고친다.

# 통계 보고 시 주의 (plan §1.4 각주, §7 리스크 2): K50은 시나리오 2개뿐이라
# 통계적 대표성이 낮다. 1차 티어의 통계 보고는 K100/K200 중심으로 하고, K50은
# 저수요 참조점(reference point)으로 병기한다.
notes:
  primary_reporting: >-
    K50 has only 2 scenario files and is not statistically representative.
    Statistical reporting over the primary tier should center on K100/K200,
    with K50 noted as a low-demand reference point rather than pooled in on
    equal footing.

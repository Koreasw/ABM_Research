# FROZEN REGRESSION PATH — pre-§1.6 geometry (no basement).
#
# Identical to configs/baseline_10f.yaml except building.n_basements = 0 and no
# pedestrian.ground_split, i.e. the building exactly as it stood before the
# people-only basements B1/B2 were added (etc/plan_h0_revision.md §1.6, 사용자
# 확정 2026-08-03 3차).
#
# Purpose: tests/test_h0_frozen_snapshot.py replays this config against the
# snapshots in results/pre_basement/ and requires them to be bit-identical. That
# is what proves §1.6 changed the building rather than the *model* — the floor
# rank refactor it required touches elevator dispatch, wait estimation and the
# KPI position series, all of which are shared with every above-ground path.
#
# Do not "update" this file to track baseline_10f.yaml: any real change here
# would have to be justified against those frozen snapshots. It is a regression
# path, not a second baseline. Not used by the paper track.
